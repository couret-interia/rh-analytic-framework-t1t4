name: Zenodo withdrawal marker
on:
  pull_request:
    paths:
      - .github/workflows/zenodo-withdrawal.yml
      - .github/scripts/check_zenodo_withdrawal.py
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check_zenodo_withdrawal.py --self-test
      - run: python3 .github/scripts/check_zenodo_withdrawal.py
